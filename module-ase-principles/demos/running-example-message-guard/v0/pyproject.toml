[project]
name = "message-guard"
version = "0.0.0"
description = "A message guard: the running example of the agentic software engineering principles module (version A0)."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guard"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=guard --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["req(*ids): the clause identifiers this test is evidence for"]

[tool.ruff]
line-length = 100

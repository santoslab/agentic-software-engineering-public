[project]
name = "mcp-music-homework"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "neo4j==6.0.3"]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]
